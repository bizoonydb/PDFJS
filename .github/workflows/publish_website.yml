
name: Publish website

on:
  push:
    branches:
      - master

# Evita duas publicações simultâneas
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      # BAIXAR REPOSITÓRIO
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # NODE.JS 24
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # INSTALAR DEPENDÊNCIAS
      - name: Install dependencies
        run: npm ci

      # COMPILAR PDF.JS
      - name: Build the website
        run: npx gulp web

      # VERIFICAR SE A PASTA EXISTE
      - name: Verify build directory
        shell: bash
        run: |
          if [ ! -d "build/gh-pages" ]; then
            echo "::error::Pasta build/gh-pages não encontrada!"
            exit 1
          fi

          echo "Build encontrado com sucesso."

      # ANALISAR TAMANHO DO SITE
      - name: Analyze website size
        shell: bash
        run: |

          echo "======================================"
          echo " TAMANHO TOTAL DO SITE"
          echo "======================================"

          du -sh build/gh-pages

          echo ""
          echo "======================================"
          echo " 30 MAIORES ARQUIVOS"
          echo "======================================"

          find build/gh-pages -type f -printf '%s %p\n' \
            | sort -nr \
            | head -30 \
            | numfmt --field=1 --to=iec

          echo ""
          echo "======================================"
          echo " ARQUIVOS ACIMA DE 50 MB"
          echo "======================================"

          find build/gh-pages -type f -size +50M -print

          echo ""
          echo "======================================"
          echo " TAMANHO POR PASTA"
          echo "======================================"

          du -h --max-depth=2 build/gh-pages | sort -hr | head -30

      # VERIFICAR LOGIN.HTML
      - name: Verify login page
        shell: bash
        run: |

          echo "Procurando a página login.html..."

          if [ -f "build/gh-pages/a/login.html" ]; then
            echo "LOGIN.HTML ENCONTRADO!"
            ls -lh build/gh-pages/a/login.html
          else
            echo "::error::a/login.html não foi encontrado no build!"

            echo "Arquivos semelhantes encontrados:"

            find build/gh-pages -iname "login.html" -print

            exit 1
          fi

      # VERIFICAR ARQUIVOS ESSENCIAIS
      - name: Verify website files
        shell: bash
        run: |

          echo "Arquivos da publicação:"

          find build/gh-pages -maxdepth 2 -type f | head -100

      # ENVIAR ARTEFATO CORRETO PARA GITHUB PAGES
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/gh-pages
          retention-days: 1

  # PUBLICAÇÃO
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v5
