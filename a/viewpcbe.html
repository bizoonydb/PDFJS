  function highlightAllMatchingNet(netName){
    const svg = svgContainer.querySelector('svg');
    if(!svg) return;
    svg.querySelectorAll('.link-line').forEach(l=>l.remove());
    svg.querySelectorAll('.highlighted-overlay').forEach(el=>el.remove());
    svg.querySelectorAll(".highlight-net-overlay").forEach(el=>el.remove());
    if(!netName) return;

    const list = componentByNet.get(netName) || [];
    const frag = document.createDocumentFragment();

    list.forEach(item=>{
      const obj = parseComponent(item.component);
      const rect = svg.querySelector(
        `rect[x="${obj.x}"][y="${obj.y}"][width="${obj.w}"][height="${obj.h}"]`
      );
      const cx=obj.x+obj.w/2, cy=obj.y+obj.h/2, r=obj.w/2;
      const circle = svg.querySelector(`circle[cx="${cx}"][cy="${cy}"][r="${r}"]`);
      const target = rect || circle;
      if(!target) return;
      frag.appendChild(createOverlayForElement(target));
    });
    svg.appendChild(frag);
  }

  function createOverlayForElement(el){
    const ns = "http://www.w3.org/2000/svg";
    const tag = el.tagName.toLowerCase();
    let o;
    if(tag==="rect"){
      o = document.createElementNS(ns,"rect");
      o.setAttribute("x",el.getAttribute("x"));
      o.setAttribute("y",el.getAttribute("y"));
      o.setAttribute("width",el.getAttribute("width"));
      o.setAttribute("height",el.getAttribute("height"));
    } else if(tag==="circle"){
      o = document.createElementNS(ns,"circle");
      o.setAttribute("cx",el.getAttribute("cx"));
      o.setAttribute("cy",el.getAttribute("cy"));
      o.setAttribute("r",el.getAttribute("r"));
    } else return null;
    o.setAttribute("fill","rgba(255,0,0,0.20)");
    o.setAttribute("stroke","#ff2b2b");
    // start bitmap code - fenil
    // Initial stroke width for the new overlay; the same value will
    // be refreshed on every zoom step by applyZoomLineThickness().
    // We use style.strokeWidth (not setAttribute) so it overrides the
    // `.highlight-net-overlay { stroke-width:20 }` CSS class rule.
    o.style.strokeWidth = getZoomStroke('highlightNetOverlay');
    // end bitmap code - fenil
    o.setAttribute("pointer-events","none");
    o.classList.add("highlight-net-overlay");
    return o;
  }

  function drawConnectionLine(points){
    if(!points || points.length<2) return;
    const svg = svgContainer.querySelector('svg');
    if(!svg) return;

    svg.querySelectorAll('.link-line').forEach(l=>l.remove());
    svg.querySelectorAll('.highlighted-overlay').forEach(el=>el.remove());
    svg.querySelectorAll(".highlight-net-overlay").forEach(el=>el.remove());

    const centers = [];
    const ns = "http://www.w3.org/2000/svg";
    const frag = document.createDocumentFragment();

   
    const netLabelText = String(window.currentNetName || '');
    const pinByLocation = new Map();
    for(const p of points){
      if(p && p.component){
        pinByLocation.set(String(p.component).trim(), p);
      }
    }
    function _hasMeaning(v){
      if(v === null || v === undefined) return false;
      const s = String(v).trim();
      return s.length > 0 && s.toUpperCase() !== 'NIL';
    }
    function _findPinForLocation(tx, ty, tw, th){
      // First try exact rounded key match.
      const k = `x${Math.round(tx)}_y${Math.round(ty)}_w${Math.round(tw)}_h${Math.round(th)}`;
      const direct = pinByLocation.get(k);
      if(direct) return direct;
      // Fall back to centre containment (handles fractional or
      // string-form coords from `target` snippets).
      const ccx = tx + tw / 2;
      const ccy = ty + th / 2;
      for(const p of pinByLocation.values()){
        const c = parseComponent(p.component);
        if(!c) continue;
        if(ccx < c.x || ccx > c.x + c.w) continue;
        if(ccy < c.y || ccy > c.y + c.h) continue;
        return p;
      }
      return null;
    }
   
    function _renderPadLabelStyled(cx, cy, w, h, pin, fallbackNet){
      const footprt  = (pin && _hasMeaning(pin.footprint))  ? String(pin.footprint).trim()  : '';
      const netRaw   = (pin && _hasMeaning(pin.netName))    ? String(pin.netName).trim()    : (fallbackNet || '');
      if(!footprt && !netRaw) return;

      // Font sizing — primary line (footprint) is biggest, others
      // scale relative to it. Auto-shrink so the longest fits.
      let base = Math.min(w, h) * 0.18;
      const longest = Math.max(
        (footprt? footprt.length: 0),
        (netRaw ? netRaw.length : 0),
        1
      );
      const maxW = w * 0.88;
      const estW = longest * base * 0.55;
      if(estW > maxW) base = maxW / (longest * 0.5);
      if(!isFinite(base) || base <= 0) base = Math.max(1, Math.min(w, h) * 0.1);

      const fpFont     = base * 1.0;
      const netFont    = base * 1.0;
      const gap        = base * 0.08;

      // Centre the block vertically.
      const rows = [];
      if(footprt) rows.push({ kind:'fp',     fs: fpFont,    text: footprt });
      if(netRaw)  rows.push({ kind:'net',    fs: netFont,   text: netRaw });
      let totalH = rows.reduce((a, r) => a + r.fs, 0) + gap * (rows.length - 1);
      let yCur   = cy - totalH / 2;

      rows.forEach((r, i) => {
        const rowCy = yCur + r.fs / 2;
        const txt = document.createElementNS(ns, "text");
        txt.setAttribute("x", cx);
        txt.setAttribute("y", rowCy);
        txt.setAttribute("fill", "#0a0a0a");
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("dominant-baseline", "middle");
        txt.setAttribute("font-size", r.fs);
        txt.setAttribute("font-weight", r.kind === 'fp' ? "700" : "600");
        txt.style.pointerEvents = "none";
        txt.style.userSelect    = "none";
        txt.textContent = r.text;
        txt.classList.add("highlighted-overlay");
        txt.classList.add("net-pin-label");
        frag.appendChild(txt);
        yCur += r.fs + gap;
      });
    }

    function addPadLabel(cx, cy, w, h, tx, ty, tw, th){
      if(![cx,cy,w,h].every(v => isFinite(v))) return;
      const pin = _findPinForLocation(
        isFinite(tx) ? tx : cx - w/2,
        isFinite(ty) ? ty : cy - h/2,
        isFinite(tw) ? tw : w,
        isFinite(th) ? th : h
      );
      _renderPadLabelStyled(cx, cy, w, h, pin, netLabelText);
    }
   
    function addRectNode(tx, ty, tw, th){
      if(![tx,ty,tw,th].every(v=>isFinite(v))) return false;
      if(tw <= 0 || th <= 0) return false;
      centers.push({x: tx + tw/2, y: ty + th/2});
      const ov = document.createElementNS(ns,"rect");
      ov.setAttribute("x", tx); ov.setAttribute("y", ty);
      ov.setAttribute("width", tw); ov.setAttribute("height", th);
      ov.setAttribute("rx", 8);
      ov.setAttribute("fill","rgba(255,0,0,0.6)");
      ov.setAttribute("stroke","#ff2b2b");
      // start bitmap code - fenil
      ov.style.strokeWidth = getZoomStroke('highlightedOverlay');
      // end bitmap code - fenil
      ov.setAttribute("pointer-events","none");
      ov.classList.add("highlighted-overlay");
      frag.appendChild(ov);
      // start net-label-on-pad 28/05/2026 v4
      addPadLabel(tx + tw/2, ty + th/2, tw, th, tx, ty, tw, th);
      // end net-label-on-pad 28/05/2026 v4
      return true;
    }
    function addCircleNode(cx, cy, r){
      if(![cx,cy,r].every(v=>isFinite(v))) return false;
      if(r <= 0) return false;
      centers.push({x: cx, y: cy});
      const ov = document.createElementNS(ns,"circle");
      ov.setAttribute("cx", cx); ov.setAttribute("cy", cy); ov.setAttribute("r", r);
      ov.setAttribute("fill","rgba(255,0,0,0.6)");
      ov.setAttribute("stroke","#ff2b2b");
      // start bitmap code - fenil
      ov.style.strokeWidth = getZoomStroke('highlightedOverlay');
      // end bitmap code - fenil
      ov.setAttribute("pointer-events","none");
      ov.classList.add("highlighted-overlay");
      frag.appendChild(ov);
      // start net-label-on-pad 28/05/2026 v4
      addPadLabel(cx, cy, 2*r, 2*r, cx - r, cy - r, 2*r, 2*r);
      // end net-label-on-pad 28/05/2026 v4
      return true;
    }
    // end line - component color 28/05/2026

    points.forEach(p=>{
      if(!p) return;
    
      let added = false;
      if(p.target){
        const tmp = document.createElement('div');
        tmp.innerHTML = String(p.target).trim();
        const el = tmp.firstChild;
        if(el && el.tagName){
          const tag = el.tagName.toLowerCase();
          if(tag === 'rect'){
            added = addRectNode(
              parseFloat(el.getAttribute('x')),
              parseFloat(el.getAttribute('y')),
              parseFloat(el.getAttribute('width')),
              parseFloat(el.getAttribute('height'))
            );
          } else if(tag === 'circle'){
            added = addCircleNode(
              parseFloat(el.getAttribute('cx')),
              parseFloat(el.getAttribute('cy')),
              parseFloat(el.getAttribute('r'))
            );
          }
        }
      }
    
      if(!added && p.component){
        const c = parseComponent(p.component);
        if(c){
          const cx = c.x + c.w/2;
          const cy = c.y + c.h/2;
          const r  = c.w/2;
          // Prefer a circle when the live SVG actually has one at
          // that center (BGA-style pad), otherwise draw a rect.
          const circleEl = svg.querySelector(
            `circle[cx="${cx}"][cy="${cy}"][r="${r}"]`
          );
          if(circleEl){
            added = addCircleNode(cx, cy, r);
          } else {
            added = addRectNode(c.x, c.y, c.w, c.h);
          }
        }
      }
     
    });

    if(centers.length<2){ svg.appendChild(frag); return; }
    centers.sort((a,b)=>a.x-b.x);

    const path = document.createElementNS(ns,'path');
    let d = `M ${centers[0].x} ${centers[0].y}`;
    let cx = centers[0].x, cy = centers[0].y;
    for(let i=1;i<centers.length;i++){
      const t = centers[i];
      const mx = (cx+t.x)/2;
      d += ` L ${mx} ${cy} L ${mx} ${t.y} L ${t.x} ${t.y}`;
      cx=t.x; cy=t.y;
    }
    path.setAttribute('d',d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke','red');
    // start bitmap code - fenil
    // Initial stroke width for the red connector line; refreshed
    // on every wheel-zoom step by applyZoomLineThickness().
    path.style.strokeWidth = getZoomStroke('linkLine');
    // end bitmap code - fenil
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('stroke-opacity','0.7');
    path.classList.add('link-line');
    frag.appendChild(path);
    svg.appendChild(frag);
  }

 
  function setupSearchSuggestions(){
    const searchInput = document.getElementById("search-input");
    if(!searchInput) return;

    const box = document.createElement("div");
    Object.assign(box.style,{
      position:"absolute",
      background:"rgba(20,20,20,0.95)",
      border:"1px solid #555",
      borderRadius:"8px",
      padding:"4px 0",
      maxHeight:"180px",
      overflowY:"auto",
      zIndex:"9999",
      color:"#fff",
      fontSize:"14px",
      display:"none"
    });
    document.body.appendChild(box);

    function updatePos(){
      const r = searchInput.getBoundingClientRect();
      box.style.left = `${r.left}px`;
      box.style.top  = `${r.bottom + window.scrollY}px`;
      box.style.width = `${searchInput.offsetWidth}px`;
    }
    updatePos();

    let debounce = null;
    function getComponentSuggestionMatches(query){
      const q = String(query || '').trim().toLowerCase();
      if(!q) return [];
      const seen = new Set();
      const matches = [];
      const sources = [
        window.currentComponentData,
        window.allComponentsList,
        window.allComponentsListV2
      ];

      sources.forEach(list=>{
        if(!Array.isArray(list)) return;
        list.forEach(c=>{
          const name = String((c && (c.name || c.component_name)) || '').trim();
          if(!name) return;
          const key = name.toLowerCase();
          if(!key.startsWith(q) || seen.has(key)) return;
          seen.add(key);
          matches.push({type:'component', value:name});
        });
      });

      matches.sort((a,b)=>a.value.localeCompare(b.value, undefined, {numeric:true, sensitivity:'base'}));
      return matches.slice(0, 40);
    }

    function getNetSuggestionMatches(query){
      const q = String(query || '').trim().toLowerCase();
      if(!q) return [];
      const matches = [];
      for(const net of componentByNet.keys()){
        const value = String(net || '').trim();
        if(value.toLowerCase().startsWith(q)){
          matches.push({type:'net', value});
          if(matches.length>=20) break;
        }
      }
      return matches;
    }

    searchInput.addEventListener("input", ()=>{
      clearTimeout(debounce);
      debounce = setTimeout(()=>{
        const q = searchInput.value.trim().toLowerCase();
        box.innerHTML = "";
        if(!q){ box.style.display="none"; return; }

        const componentMatches = getComponentSuggestionMatches(q);
        const matches = componentMatches.length ? componentMatches : getNetSuggestionMatches(q);
        if(!matches.length){ box.style.display="none"; return; }

        const frag = document.createDocumentFragment();
        matches.forEach(match=>{
          const item = document.createElement("div");
          item.className = "suggestion-item";
          item.dataset.value = match.value;
          item.dataset.type = match.type;
          item.textContent = match.value;
          Object.assign(item.style,{
            padding:"6px 10px",
            cursor:"pointer",
            borderBottom:"1px solid rgba(255,214,10,0.12)"
          });
          item.onmouseenter = ()=> {
            item.style.background="#ffd60a";
            item.style.color="#050505";
          };
          item.onmouseleave = ()=> item.style.background="transparent";
          item.onmouseleave = ()=> {
            item.style.background="transparent";
            item.style.color="";
          };
          frag.appendChild(item);
        });
        box.appendChild(frag);
        updatePos();
        box.style.display="block";
      }, 100);
    });

    box.addEventListener("click", e=>{
      const item = e.target.closest(".suggestion-item");
      if(!item) return;
      const value = item.dataset.value;
      searchInput.value = value;
      box.style.display = "none";
      if(typeof window.__sbpm_runSearchFromInput === 'function'){
        window.__sbpm_runSearchFromInput();
      } else if(item.dataset.type === 'net'){
        window.currentNetName = value;
        applyNetSelection(value, window.allComponentsList);
      }
    });

    searchInput.addEventListener("blur", ()=> setTimeout(()=>box.style.display="none",150));
    window.addEventListener("resize", updatePos);

    function _showFoundBadge(found, label){
      let badge = document.getElementById('search-status-badge');
      if(!badge){
        badge = document.createElement('div');
        badge.id = 'search-status-badge';
        Object.assign(badge.style, {
          position:'absolute', padding:'2px 8px', borderRadius:'10px',
          fontSize:'11px', fontWeight:'600', zIndex:'10000',
          pointerEvents:'none', boxShadow:'0 2px 6px rgba(0,0,0,0.25)'
        });
        document.body.appendChild(badge);
      }
      const r = searchInput.getBoundingClientRect();
      badge.style.left = (r.left) + 'px';
      badge.style.top  = (r.bottom + window.scrollY + 4) + 'px';
      if(found){
        badge.textContent = label || 'found';
        badge.style.background = '#c8efd2';
        badge.style.color      = '#1e7e34';
        badge.style.border     = '1px solid #1e7e34';
      } else {
        badge.textContent = 'not found';
        badge.style.background = '#f8d7da';
        badge.style.color      = '#721c24';
        badge.style.border     = '1px solid #721c24';
      }
      badge.style.display = 'inline-block';
      clearTimeout(_showFoundBadge._t);
      _showFoundBadge._t = setTimeout(()=>{ badge.style.display = 'none'; }, 4000);
    }

    function _highlightChipByName(name){
     
      const want = String(name || '').trim().toLowerCase();
      if(!want || !Array.isArray(window.allComponentsList)) return false;
      let best = null;
      for(const c of window.allComponentsList){
        const n = String(c && c.component_name || '').trim().toLowerCase();
        if(!n) continue;
        if(n === want){ best = c; break; }
        if(!best && n.includes(want)) best = c;
      }
      if(!best) return false;
      const loc = parseComponentCoordinates(best.component_location);
      if(!loc) return false;
      if(typeof showChipPinNames === 'function'){
        showChipPinNames(loc.x, loc.y, loc.width, loc.height);
      }
     
      let chipOutlineEl = null;
      try {
        const svg = svgContainer.querySelector('svg');
        if(svg){
          const ns = "http://www.w3.org/2000/svg";
          const rect = document.createElementNS(ns, "rect");
          rect.setAttribute("x", loc.x);
          rect.setAttribute("y", loc.y);
          rect.setAttribute("width", loc.width);
          rect.setAttribute("height", loc.height);
          // v15 22-06-2026: rx scaled to chip size (5 % of shorter
          // side, capped 0..3 userspace) so corners look slightly
          // rounded like the client's sample, not heavily rounded.
          const chipShort15 = Math.min(loc.width || 0, loc.height || 0);
          const rx15 = Math.max(0, Math.min(3, chipShort15 * 0.05));
          rect.setAttribute("rx", rx15);
          rect.setAttribute("fill", "none");
          rect.setAttribute("stroke", "#00bfff");
        
          rect.setAttribute("vector-effect", "non-scaling-stroke");
          rect.style.strokeWidth = "2";
          rect.setAttribute("pointer-events", "none");
          rect.classList.add("highlighted-overlay");
          rect.classList.add("chip-search-outline");
          svg.appendChild(rect);
          chipOutlineEl = rect; // v12 — scrollIntoView fallback
        }
      } catch(_){}
     
      try {
        const svgEl = svgContainer.querySelector('svg');
        if(svgEl
           && typeof scheduleTransform === 'function'
           && typeof translate !== 'undefined'
           && typeof scale !== 'undefined'){
          // Cache the SVG's original viewBox once so successive
          // searches don't accumulate (we always derive new viewBox
          // from the ORIGINAL, not the previously-zoomed one).
          if (typeof window.__sbpm_svg_origViewBox === 'undefined'){
            const vb0 = svgEl.viewBox && svgEl.viewBox.baseVal;
            if (vb0){
              window.__sbpm_svg_origViewBox = {
                x: vb0.x, y: vb0.y, w: vb0.width, h: vb0.height
              };
            } else {
              window.__sbpm_svg_origViewBox = null;
            }
          }
          const orig = window.__sbpm_svg_origViewBox;
          // ---- Step 1: reset CSS transform to known-good baseline ----
          scale       = 1;
          translate.x = 0;
          translate.y = 0;
          scheduleTransform();
          // ---- Step 2: compute new viewBox centred on chip ----
          if (orig && isFinite(loc.x) && isFinite(loc.y)
              && isFinite(loc.width) && isFinite(loc.height)
              && loc.width > 0 && loc.height > 0){
            const parentRect0 = svgContainer.parentElement
              ? svgContainer.parentElement.getBoundingClientRect()
              : { width: window.innerWidth, height: window.innerHeight };
            const paneW = Math.max(1, parentRect0.width);
            const paneH = Math.max(1, parentRect0.height);
            const paneAspect = paneW / paneH;
            
            const fitFrac = 0.12;
            const chipMax = Math.max(loc.width, loc.height);
            // base view size (in userspace) so chip = 25% of shorter pane side
            const viewShort = chipMax / fitFrac; // shorter side of viewBox
            let viewW, viewH;
            if (paneAspect >= 1){
            
              viewH = viewShort;
              viewW = viewH * paneAspect;
            } else {
              viewW = viewShort;
              viewH = viewW / paneAspect;
            }
          
            if (viewW > orig.w) viewW = orig.w;
            if (viewH > orig.h) viewH = orig.h;
            // Centre on chip
            const cx = loc.x + loc.width  / 2;
            const cy = loc.y + loc.height / 2;
            let vbX = cx - viewW / 2;
            let vbY = cy - viewH / 2;
            // Don't pan past the original viewBox edges
            if (vbX < orig.x) vbX = orig.x;
            if (vbY < orig.y) vbY = orig.y;
            if (vbX + viewW > orig.x + orig.w) vbX = orig.x + orig.w - viewW;
            if (vbY + viewH > orig.y + orig.h) vbY = orig.y + orig.h - viewH;
            svgEl.setAttribute('viewBox', `${vbX} ${vbY} ${viewW} ${viewH}`);
            svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            
            try { if (typeof applyZoomLineThickness === 'function') applyZoomLineThickness(); } catch(_){}
            try { console.log(
              '[BRAZILIAN-svg] zoom-to-chip (v13 viewBox) → chip@user=(%s,%s) size=(%s,%s) viewBox=(%s %s %s %s) origVB=(%s %s %s %s)',
              cx.toFixed(0), cy.toFixed(0),
              loc.width.toFixed(0), loc.height.toFixed(0),
              vbX.toFixed(0), vbY.toFixed(0), viewW.toFixed(0), viewH.toFixed(0),
              orig.x.toFixed(0), orig.y.toFixed(0), orig.w.toFixed(0), orig.h.toFixed(0)
            ); } catch(_){}
          } else {
            try { console.warn('[BRAZILIAN-svg] v13 viewBox zoom skipped — no orig viewBox or bad loc', orig, loc); } catch(_){}
          }
        }
      } catch(e){
        try { console.warn('[BRAZILIAN-svg] zoom-to-chip failed:', e); } catch(_){}
      }
      // end search-trigger 28/05/2026 v13
      return true;
    }

    function _zoomToLocation(loc){
      try {
        const svgEl = svgContainer.querySelector('svg');
        if(!svgEl || !loc) return;
        if (typeof window.__sbpm_svg_origViewBox === 'undefined'){
          const vb0 = svgEl.viewBox && svgEl.viewBox.baseVal;
          window.__sbpm_svg_origViewBox = vb0
            ? {x: vb0.x, y: vb0.y, w: vb0.width, h: vb0.height}
            : null;
        }
        const orig = window.__sbpm_svg_origViewBox;
        if(!orig) return;
        scale = 1;
        translate.x = 0;
        translate.y = 0;
        scheduleTransform();

        const parentRect = svgContainer.parentElement
          ? svgContainer.parentElement.getBoundingClientRect()
          : {width: window.innerWidth, height: window.innerHeight};
        const paneAspect = Math.max(1, parentRect.width) / Math.max(1, parentRect.height);
        const fitFrac = 0.12;
        const itemMax = Math.max(loc.width, loc.height);
        const viewShort = itemMax / fitFrac;
        let viewW, viewH;
        if(paneAspect >= 1){
          viewH = viewShort;
          viewW = viewH * paneAspect;
        } else {
          viewW = viewShort;
          viewH = viewW / paneAspect;
        }
        if(viewW > orig.w) viewW = orig.w;
        if(viewH > orig.h) viewH = orig.h;

        const cx = loc.x + loc.width / 2;
        const cy = loc.y + loc.height / 2;
        let vbX = cx - viewW / 2;
        let vbY = cy - viewH / 2;
        if(vbX < orig.x) vbX = orig.x;
        if(vbY < orig.y) vbY = orig.y;
        if(vbX + viewW > orig.x + orig.w) vbX = orig.x + orig.w - viewW;
        if(vbY + viewH > orig.y + orig.h) vbY = orig.y + orig.h - viewH;
        svgEl.setAttribute('viewBox', `${vbX} ${vbY} ${viewW} ${viewH}`);
        svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        try { applyZoomLineThickness(); } catch(_){}
      } catch(_){}
    }

    function _highlightPinsByComponentName(name){
      const want = String(name || '').trim().toLowerCase();
      const list = Array.isArray(window.currentComponentData) ? window.currentComponentData : [];
      if(!want || !list.length) return false;

      let matches = list.filter(c=>{
        const n = String((c && (c.name || c.component_name)) || '').trim().toLowerCase();
        return n === want;
      });
      if(!matches.length){
        matches = list.filter(c=>{
          const n = String((c && (c.name || c.component_name)) || '').trim().toLowerCase();
          return n.startsWith(want);
        });
      }
      if(!matches.length) return false;

      const svg = svgContainer.querySelector('svg');
      if(!svg) return false;
      svg.querySelectorAll('.highlighted-overlay,.link-line,.net-pin-label').forEach(el=>el.remove());

      const ns = "http://www.w3.org/2000/svg";
      const frag = document.createDocumentFragment();
      let firstLoc = null;

      matches.forEach(pin=>{
        const loc = getPinCoordinates(pin);
        if(!loc || !loc.width || !loc.height) return;
        if(!firstLoc) firstLoc = loc;
        const rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x', loc.x);
        rect.setAttribute('y', loc.y);
        rect.setAttribute('width', loc.width);
        rect.setAttribute('height', loc.height);
        rect.setAttribute('rx', Math.min(8, Math.min(loc.width, loc.height) * 0.15));
        rect.setAttribute('fill', 'rgba(255,0,0,0.45)');
        rect.setAttribute('stroke', '#ff2b2b');
        rect.style.strokeWidth = getZoomStroke('highlightedOverlay');
        rect.setAttribute('pointer-events', 'none');
        rect.classList.add('highlighted-overlay');
        frag.appendChild(rect);
      });

      if(!firstLoc) return false;
      svg.appendChild(frag);
      _zoomToLocation(firstLoc);
      return true;
    }

    function runSearchFromInput(){
      const raw = String(searchInput.value || '').trim();
      if(!raw){ return; }
      const upper = raw.toUpperCase();
      const lower = raw.toLowerCase();
      // 1) exact net-name match
      if(componentByNet.has(upper)){
        window.currentNetName = upper;
        applyNetSelection(upper, window.allComponentsList);
        _showFoundBadge(true, 'found');
        if(box) box.style.display = 'none';
        return;
      }
      // 2) case-insensitive net-name match
      let netHit = null;
      for(const net of componentByNet.keys()){
        if(String(net).toLowerCase() === lower){ netHit = net; break; }
      }
      if(netHit){
        window.currentNetName = netHit;
        applyNetSelection(netHit, window.allComponentsList);
        _showFoundBadge(true, 'found');
        if(box) box.style.display = 'none';
        return;
      }
      // 3) pin/component name match from JSON
      if(_highlightPinsByComponentName(raw)){
        _showFoundBadge(true, 'component found');
        if(box) box.style.display = 'none';
        return;
      }
      // 4) net-name containment (first hit)
      for(const net of componentByNet.keys()){
        if(String(net).toLowerCase().includes(lower)){ netHit = net; break; }
      }
      if(netHit){
        window.currentNetName = netHit;
        applyNetSelection(netHit, window.allComponentsList);
        _showFoundBadge(true, 'found ('+netHit+')');
        if(box) box.style.display = 'none';
        return;
      }
      // 5) main-component (chip) name match
      if(_highlightChipByName(raw)){
        _showFoundBadge(true, 'chip found');
        if(box) box.style.display = 'none';
        return;
      }
      // 6) nothing matched
      _showFoundBadge(false);
    }

    // Enter triggers the search.
    searchInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); runSearchFromInput(); }
    });
    // When the value is set programmatically (compare-search
    // broadcast), 'change' fires — run the search then.
    searchInput.addEventListener('change', runSearchFromInput);
    // Also expose for external triggers.
    window.__sbpm_runSearchFromInput = runSearchFromInput;
    // end search-trigger 28/05/2026
  }
  setupSearchSuggestions();

  
  function loadProblemsFromJson(problems){
    const sel = document.getElementById("problemSelect");
    sel.innerHTML = `<option value="">-- Select Issue --</option>`;
    if(!Array.isArray(problems) || !problems.length) return;

    const frag = document.createDocumentFragment();
    problems.forEach((p, i)=>{
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.problem_title || p.title || `Problem ${i+1}`;
      frag.appendChild(opt);
    });
    sel.appendChild(frag);
  }

  document.getElementById("problemSelect").addEventListener("change", function(){
    const titleCk = document.getElementById("enable-title-checkbox");
    const ptSel = document.getElementById("pointSelect");
    if(!titleCk.checked){
      //Swal.fire({icon:'warning',title:'Checkbox not enabled',text:'Please enable "Show Titles" first!'});
      if(typeof Swal !== 'undefined'){
        Swal.fire({icon:'warning',title:'Checkbox not enabled',text:'Please enable "Show Titles" first!'});
      } else {
        alert('Please enable "Show Titles" first!');
      }
      this.value = "";
      ptSel.innerHTML = `<option value="">-- Select Point --</option>`;
      return;
    }
    const idx = this.value;
    ptSel.innerHTML = `<option value="">-- Select Point --</option>`;
    if(idx === "") return;

    const problem = window.loadedProblems?.[idx];
    if(!problem) return;

    const solutionComponents = problem.components || problem.solutions || [];
    window.loadedProblemComponents = solutionComponents;

    const frag = document.createDocumentFragment();
    solutionComponents.forEach((c,i)=>{
      const title = c.component_name ?? `Point ${i+1}`;
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${title} (Check: ${c.netName||''})`;
      frag.appendChild(opt);
    });
    ptSel.appendChild(frag);
  });

  document.getElementById("pointSelect").addEventListener("change", function(){
    const idx = this.value;
    if(idx === ""){ highlightAllMatchingNet(""); return; }
    const c = window.loadedProblemComponents?.[idx];
    if(!c) return;
    applyNetSelection(c.netName || "", window.allComponentsList);
  });

  /* =========================================================
     LOCAL FILES + SINGLE FILE EXPORT
     ========================================================= */
  function readLocalFile(file, mode){
    return new Promise((resolve, reject) => {
      if(!file){ reject(new Error('No file selected.')); return; }
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('Could not read file.'));
      if(mode === 'text') reader.readAsText(file);
      else reader.readAsArrayBuffer(file);
    });
  }

  function showLoadError(message){
    svgContainer.innerHTML = `<p style="color:red;padding:20px;">${message}</p>`;
  }

  async function tryLoadLocalPair(){
    if(!localSvgFile || !localJsonFile) return;

    try{
      const [svgTxt, jsonTxt] = await Promise.all([
        readLocalFile(localSvgFile, 'text'),
        readLocalFile(localJsonFile, 'text')
      ]);
      const jsonData = JSON.parse(jsonTxt);
      await loadSVGWithJSONData(svgTxt, jsonData);
    }catch(err){
      console.error('Error loading local SVG/JSON:', err);
      showLoadError(`Error loading local SVG/JSON: ${err.message}`);
    }
  }

  let exportNameModalResolve = null;

  function normalizePcbeFileName(name){
    const baseName = (name || '')
      .trim()
      .replace(/[\\/:*?"<>|]+/g, '-')
      .replace(/\s+/g, ' ')
      .replace(/(?:\.pcbe|\.[^/.\\]+)$/i, '')
      .trim();

    return baseName ? `${baseName}.pcbe` : null;
  }

  function closeExportNameModal(value){
    const modal = document.getElementById('export-name-modal');
    modal.hidden = true;
    modal.setAttribute('aria-hidden', 'true');

    if(exportNameModalResolve){
      exportNameModalResolve(value);
      exportNameModalResolve = null;
    }
  }

  function requestExportFileName(){
    const modal = document.getElementById('export-name-modal');
    const input = document.getElementById('export-name-input');

    return new Promise(resolve => {
      exportNameModalResolve = resolve;
      input.value = 'svg-json-bundle';
      modal.hidden = false;
      modal.setAttribute('aria-hidden', 'false');
      window.setTimeout(() => {
        input.focus();
        input.select();
      }, 0);
    });
  }

  async function exportSingleFile(){
    if(!currentSvgContent || !currentJsonData) return;

    const requestedName = await requestExportFileName();
    const fileName = normalizePcbeFileName(requestedName);
    if(!fileName) return;

    const payload = {
      format: 'svgjson-edit-bundle',
      version: 1,
      createdAt: new Date().toISOString(),
      svg: currentSvgContent,
      json: currentJsonData
    };
    const blob = new Blob([JSON.stringify(payload)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function loadSingleFile(file){
    try{
      const txt = await readLocalFile(file, 'text');
      const payload = JSON.parse(txt);
      if(!payload || payload.format !== 'svgjson-edit-bundle' || typeof payload.svg !== 'string'){
        throw new Error('Invalid single file. Please upload a file exported by this viewer.');
      }
      await loadSVGWithJSONData(payload.svg, payload.json);
    }catch(err){
      console.error('Error loading single file:', err);
      showLoadError(`Error loading single file: ${err.message}`);
    }
  }

  async function loadSingleFileFromUrl(fileUrl){
    try{
      const res = await fetch(fileUrl, {cache:'no-cache'});
      if(!res.ok){
        throw new Error(`Could not fetch PCBE file (${res.status} ${res.statusText})`);
      }
      const txt = await res.text();
      const payload = JSON.parse(txt);
      if(!payload || payload.format !== 'svgjson-edit-bundle' || typeof payload.svg !== 'string'){
        throw new Error('Invalid PCBE file. Please provide a file exported by this viewer.');
      }
      await loadSVGWithJSONData(payload.svg, payload.json);
    }catch(err){
      console.error('Error loading PCBE URL:', err);
      showLoadError(`Error loading PCBE URL: ${err.message}`);
    }
  }

 
  const exportNameModal = document.getElementById('export-name-modal');
  const exportNameInput = document.getElementById('export-name-input');

  const loadSvgBtn = document.getElementById('load-svg-btn');
  const loadJsonBtn = document.getElementById('load-json-btn');
  
  const centerContentBtn = document.getElementById('center-content-btn');
  const zoomInBtn = document.getElementById('zoom-in-btn');
  const zoomOutBtn = document.getElementById('zoom-out-btn');
  const showVoltageBtn = document.getElementById('show-voltage-btn');
  const showDiodeBtn = document.getElementById('show-diode-btn');
  
  
 
  if(centerContentBtn) centerContentBtn.addEventListener('click', centerContent);
  if(zoomInBtn) zoomInBtn.addEventListener('click', () => zoomFromCenter(1));
  if(zoomOutBtn) zoomOutBtn.addEventListener('click', () => zoomFromCenter(-1));
  if(showVoltageBtn) showVoltageBtn.addEventListener('click', () => togglePinValueLabels('voltage'));
  if(showDiodeBtn) showDiodeBtn.addEventListener('click', () => togglePinValueLabels('diode'));
  document.getElementById('export-name-cancel').addEventListener('click', () => closeExportNameModal(null));
  document.getElementById('export-name-confirm').addEventListener('click', () => closeExportNameModal(exportNameInput.value));
  exportNameModal.addEventListener('click', event => {
    if(event.target === exportNameModal) closeExportNameModal(null);
  });
  exportNameInput.addEventListener('keydown', event => {
    if(event.key === 'Enter') closeExportNameModal(exportNameInput.value);
    if(event.key === 'Escape') closeExportNameModal(null);
  });




  localBundleInput.addEventListener('change', () => {
    const file = localBundleInput.files && localBundleInput.files[0];
    if(file) loadSingleFile(file);
  });

 
  const params = new URLSearchParams(window.location.search);
  const fileUrl = params.get('file');
  const jsonUrl = params.get('json');

  if(fileUrl && jsonUrl){
    fetchAndLoadSVGWithJSON(fileUrl, jsonUrl);
  } else if(fileUrl){
    loadSingleFileFromUrl(fileUrl);
  } else {
    document.getElementById('svg-container').innerText = "Upload a PCBE file or provide ?file=URL_DO_ARQUIVO.pcbe.";
  }
});
</script>
