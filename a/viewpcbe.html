<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PCBE</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{
  scrollbar-width:none;
  -ms-overflow-style:none;
}
*::-webkit-scrollbar{display:none;width:0;height:0}

html,body{
  margin:0;padding:0;
  width:100%;height:100%;overflow:hidden;
  background-color:#050505;
  background-image:
    linear-gradient(rgba(255,214,10,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,214,10,0.06) 1px,transparent 1px);
  background-size:40px 40px;
  font-family:'Segoe UI',Roboto,sans-serif;
}

#topbar{
  position:fixed;top:0;left:0;width:100%;
  z-index:9999;
  min-height:64px;
  background:
    linear-gradient(180deg,rgba(255,214,10,0.13),rgba(255,214,10,0.03)),
    #060606;
  border-bottom:1px solid rgba(255,214,10,0.42);
  padding:10px 14px;
  box-shadow:0 12px 36px rgba(0,0,0,0.62),0 1px 0 rgba(255,255,255,0.06) inset;
  color:#ffe66d;
  display:flex;align-items:center;justify-content:flex-start;gap:10px;
  flex-wrap:wrap;
  backdrop-filter:blur(10px);
  overflow:hidden;
  white-space:nowrap;
}
#topbar label{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
}
#topbar input[type="checkbox"]{
  width:18px;height:18px;accent-color:#ffd60a;cursor:pointer;
}
#topbar select, #topbar input[type="text"]{
  height:40px;
  padding:0 12px;font-size:13px;
  border:1px solid rgba(255,214,10,0.34);
  border-radius:8px;
  background:#111;
  color:#fff7b0;outline:none;
  font-family:inherit;
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset;
}
#topbar select option{background:#0b0b0b;color:#fff7b0}
#topbar select:focus,#topbar input[type="text"]:focus{
  border-color:#ffd60a;
  box-shadow:0 0 0 3px rgba(255,214,10,0.2);
}
#search-input{width:168px;transition:border-color .2s,box-shadow .2s}
#problemSelect{min-width:190px;max-width:260px}
#pointSelect{min-width:170px;max-width:240px}
.file-actions{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-left:auto}
.toolbar-button{
  height:40px;
  min-width:40px;
  border:1px solid rgba(255,214,10,0.42);
  border-radius:8px;
  background:#141414;
  color:#ffd60a;
  font:600 13px 'Segoe UI',Roboto,sans-serif;
  padding:0 12px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset;
  transition:background .18s,border-color .18s,color .18s,transform .18s;
}
.toolbar-button:hover{background:#ffd60a;border-color:#ffd60a;color:#050505}
.toolbar-button.is-active{
  background:#ffd60a;
  border-color:#ffd60a;
  color:#050505;
}
.toolbar-button:active{transform:translateY(1px)}
.toolbar-button:disabled{opacity:.45;cursor:not-allowed}
.toolbar-button svg,.icon-toggle svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor}
.toolbar-button .voltage-icon .voltage-bolt{fill:#ffd60a;stroke:#ffd60a}
.toolbar-button.is-active .voltage-icon .voltage-bolt{fill:#050505;stroke:#050505}
.sr-file-input{display:none}
.topbar-divider{
  width:1px;height:32px;
  background:rgba(255,214,10,0.28);
  flex:0 0 auto;
}
.icon-toggle{
  height:40px;
  border:1px solid rgba(255,214,10,0.38);
  border-radius:8px;
  background:#101010;
  color:#ffd60a;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font:700 13px 'Segoe UI',Roboto,sans-serif;
  cursor:pointer;
  user-select:none;
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset;
  transition:background .18s,border-color .18s,color .18s,transform .18s;
}
.icon-toggle input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.icon-toggle:hover{
  border-color:#ffd60a;
  background:#1c1c1c;
}
.icon-toggle:has(input:checked){
  background:#ffd60a;
  border-color:#ffd60a;
  color:#050505;
}
.icon-toggle:active{transform:translateY(1px)}
.select-group{
  display:flex;
  align-items:center;
  gap:8px;
}
.select-caption{
  width:32px;height:32px;
  border:1px solid rgba(255,214,10,0.34);
  border-radius:8px;
  color:#ffd60a;
  background:#101010;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.export-modal-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(0,0,0,0.58);
  backdrop-filter:blur(3px);
}
.export-modal-backdrop[hidden]{display:none}
.export-modal{
  width:min(420px,100%);
  border:1px solid rgba(255,214,10,0.36);
  border-radius:8px;
  background:#0b0b0b;
  color:#fff7b0;
  box-shadow:0 20px 60px rgba(0,0,0,0.48);
  padding:18px;
}
.export-modal h2{
  margin:0 0 12px;
  font-size:18px;
  font-weight:700;
  line-height:1.25;
}
.export-name-row{
  display:flex;
  align-items:center;
  overflow:hidden;
  border:1px solid rgba(255,214,10,0.34);
  border-radius:6px;
  background:#111;
}
.export-name-row:focus-within{
  border-color:#ffd60a;
  box-shadow:0 0 0 3px rgba(255,214,10,0.2);
}
#export-name-input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:#fff7b0;
  padding:10px 12px;
  font:500 14px 'Segoe UI',Roboto,sans-serif;
}
.export-extension{
  flex:0 0 auto;
  align-self:stretch;
  display:flex;
  align-items:center;
  border-left:1px solid rgba(255,214,10,0.26);
  background:rgba(255,214,10,0.12);
  color:#ffd60a;
  padding:0 12px;
  font:700 14px 'Segoe UI',Roboto,sans-serif;
  user-select:none;
}
.export-modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}

.fw-bold{font-weight:600;font-size:13px;white-space:nowrap}

#svg-container{
  width:100%;height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

#component-info-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:9998;
  min-height:58px;
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(7,7,7,0.96);
  border-top:1px solid rgba(255,214,10,0.48);
  box-shadow:0 -10px 28px rgba(0,0,0,0.55);
  color:#fff7b0;
  backdrop-filter:blur(10px);
}
#component-info-bar[hidden]{display:none}
.component-info-title{
  flex:0 0 auto;
  color:#ffd60a;
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.component-info-fields{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.component-info-fields::-webkit-scrollbar{display:none;width:0;height:0}
.component-info-field{
  flex:0 0 auto;
  min-width:92px;
  padding:5px 9px;
  border:1px solid rgba(255,214,10,0.24);
  border-radius:6px;
  background:rgba(255,214,10,0.07);
  line-height:1.2;
}
.component-info-label{
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,230,109,0.72);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  min-height:20px;
}
.component-info-icon{
  width:20px;
  height:20px;
  display:block;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.component-info-value{
  display:block;
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#fff;
  font-size:13px;
  font-weight:600;
}
@media (max-width:600px){
  #component-info-bar{align-items:flex-start;flex-direction:column;gap:5px;padding:7px 10px}
  .component-info-fields{width:100%}
}

.highlight-net-overlay{
  animation:fastBlink 0.8s infinite;
  stroke:#fff;stroke-width:20;fill:#ff0000;
}
@keyframes fastBlink{
  0%{opacity:1}50%{opacity:0.35}100%{opacity:1}
}

/* Zoom-gated visibility for title and R/L groups */
.title-group.zoom-hidden,
.rl-group.zoom-hidden {
  display: none;
}
.pin-value-text{
  paint-order:stroke;
  stroke:#050505;
  stroke-width:3px;
  stroke-linejoin:round;
  font-weight:800;
  pointer-events:none;
  user-select:none;
}
</style>
</head>
<body>

<div id="topbar">
  <button type="button" class="toolbar-button" id="zoom-out-btn" title="Zoom out" aria-label="Zoom out">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle><path d="M8 11h6"></path><path d="m16 16 5 5"></path>
    </svg>
  </button>

  <button type="button" class="toolbar-button" id="zoom-in-btn" title="Zoom in" aria-label="Zoom in">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle><path d="M8 11h6"></path><path d="M11 8v6"></path><path d="m16 16 5 5"></path>
    </svg>
  </button>

  <button type="button" class="toolbar-button" id="center-content-btn" title="Center content" aria-label="Center content">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
      <path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M2 12h4"></path><path d="M18 12h4"></path>
      <circle cx="12" cy="12" r="3"></circle><path d="M7 7l2 2"></path><path d="M15 15l2 2"></path><path d="M17 7l-2 2"></path><path d="M9 15l-2 2"></path>
    </svg>
    <span>Center</span>
  </button>

  <button type="button" class="toolbar-button" id="show-voltage-btn" title="Show voltage values" aria-label="Show voltage values" aria-pressed="false">
    <svg class="voltage-icon" viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="2" aria-hidden="true">
      <path class="voltage-bolt" d="M13 2 4 14h7l-1 8 10-13h-7z"></path>
    </svg>
    <span>Voltage</span>
  </button>

  <button type="button" class="toolbar-button" id="show-diode-btn" title="Show diode values" aria-label="Show diode values" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
      <path d="M4 12h6"></path><path d="M14 12h6"></path>
      <path d="m10 7 5 5-5 5z"></path><path d="M15 7v10"></path>
    </svg>
    <span>Diode</span>
  </button>

  <label class="icon-toggle" title="Lines">
    <input type="checkbox" id="enable-line-checkbox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
      <path d="M4 7h6"></path><path d="M14 7h6"></path><path d="M4 17h6"></path><path d="M14 17h6"></path><path d="M10 7l4 10"></path>
    </svg>
    <span>Lines</span>
  </label>

  <input type="text" id="search-input" placeholder="Search" autocomplete="off" spellcheck="false">

</div>

<div hidden>
  <input type="checkbox" id="enable-title-checkbox">
  <input type="checkbox" id="enable-rl-checkbox">
  <select id="problemSelect">
    <option value="">-- Select Issue --</option>
  </select>
  <select id="pointSelect">
    <option value="">-- Solution --</option>
  </select>
</div>

<div class="export-modal-backdrop" id="export-name-modal" hidden aria-hidden="true">
  <div class="export-modal" role="dialog" aria-modal="true" aria-labelledby="export-name-title">
    <h2 id="export-name-title">Nome do arquivo</h2>
    <div class="export-name-row">
      <input type="text" id="export-name-input" autocomplete="off" spellcheck="false">
      <span class="export-extension">.pcbe</span>
    </div>
    <div class="export-modal-actions">
      <button type="button" class="toolbar-button" id="export-name-cancel">Cancelar</button>
      <button type="button" class="toolbar-button" id="export-name-confirm">Salvar</button>
    </div>
  </div>
</div>

<div id="svg-container">
  <p>Loading File...</p>
</div>

<div id="component-info-bar" aria-live="polite">
  <div class="component-info-fields" id="component-info-fields">
    <div class="component-info-field"><span class="component-info-label">Name</span><span class="component-info-value">NIL</span></div>
    <div class="component-info-field"><span class="component-info-label">Net Name</span><span class="component-info-value">NIL</span></div>
    <div class="component-info-field"><span class="component-info-label" title="Voltage" aria-label="Voltage"><svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7z"></path></svg></span><span class="component-info-value">NIL</span></div>
    <div class="component-info-field"><span class="component-info-label" title="Diode" aria-label="Diode"><svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6"></path><path d="M14 12h6"></path><path d="m10 7 5 5-5 5z"></path><path d="M15 7v10"></path></svg></span><span class="component-info-value">NIL</span></div>
    <div class="component-info-field"><span class="component-info-label" title="Ohms" aria-label="Ohms"><svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3"></path><path d="M18 12h3"></path><path d="M6 12l2-4 3 8 3-8 3 8 1-4"></path></svg></span><span class="component-info-value">NIL</span></div>
    <div class="component-info-field"><span class="component-info-label" title="Capacitance" aria-label="Capacitance"><svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6"></path><path d="M14 12h6"></path><path d="M10 5v14"></path><path d="M14 5v14"></path></svg></span><span class="component-info-value">NIL</span></div>
    <div class="component-info-field"><span class="component-info-label">Footprint</span><span class="component-info-value">NIL</span></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const svgContainer = document.getElementById('svg-container');
  if(!svgContainer) return;

 
  const ZOOM_THRESHOLD = 12.0;

  let scale = 1;
  let translate = {x:0, y:0};
  let isPanning = false;
  let panStart = {x:0, y:0};
  let mouseMoved = false;

  const STROKE_BASE = {
   
    linkLine:            300,
    
    highlightedOverlay:    2,
   
    highlightNetOverlay:  20,
  };
  const STROKE_POWER = {
    linkLine:            1.5, // shrinks visually as scale grows
    highlightedOverlay:  1.0, // constant on-screen px
    highlightNetOverlay: 1.0, // constant on-screen px
  };
 
  const STROKE_FLOOR_FRACTION = 0.02;

  function computeStrokeBases(svg){
    if(!svg) return;

    const TARGET_LINE_PX        = 5;   // red connector line
    const TARGET_HL_OVERLAY_PX  = 1.5; // green-then-red selection halo
    const TARGET_NET_OVERLAY_PX = 3;   // blinking net-match outline

    function tryCompute(){
      let pxPerUnit = null;
      try {
        const rect = svg.getBoundingClientRect();
        if(rect && rect.width > 0){
          const vb = svg.viewBox && svg.viewBox.baseVal;
          if(vb && vb.width > 0){
            pxPerUnit = rect.width / vb.width;
          } else {
            const w = parseFloat(svg.getAttribute('width'));
            if(isFinite(w) && w > 0) pxPerUnit = rect.width / w;
          }
        }
      } catch(_){}

      if(pxPerUnit && isFinite(pxPerUnit) && pxPerUnit > 0){
        STROKE_BASE.linkLine            = TARGET_LINE_PX        / pxPerUnit;
        STROKE_BASE.highlightedOverlay  = TARGET_HL_OVERLAY_PX  / pxPerUnit;
        STROKE_BASE.highlightNetOverlay = TARGET_NET_OVERLAY_PX / pxPerUnit;
      
        try { applyZoomLineThickness(); } catch(_){}
        return true;
      }
      return false;
    }

    if(!tryCompute()){
      // Layout not ready — try again on the next frame.
      requestAnimationFrame(tryCompute);
    }
  }
  // end bitmap code - fenil 28/05/2026

  function getZoomStroke(kind){
    const base = STROKE_BASE[kind];
    const pow  = STROKE_POWER[kind];
    if(base === undefined) return 0;
    const s    = Math.max(1, scale);
    const v    = base / Math.pow(s, pow);
    return Math.max(v, base * STROKE_FLOOR_FRACTION);
  }
 
  function applyZoomLineThickness(){
    const svg = svgContainer.querySelector('svg');
    if(!svg) return;
   
    let vbRatio = 1;
    try {
      const orig = window.__sbpm_svg_origViewBox;
      const cur  = svg.viewBox && svg.viewBox.baseVal;
      if (orig && cur && cur.width > 0 && orig.w > 0){
        vbRatio = cur.width / orig.w;
      }
    } catch(_){}
    svg.querySelectorAll('.link-line').forEach(el => {
     
      el.style.strokeWidth = getZoomStroke('linkLine') * vbRatio;
    });
  
    svg.querySelectorAll('.highlighted-overlay:not(.chip-search-outline)').forEach(el => {
      el.style.strokeWidth = getZoomStroke('highlightedOverlay') * vbRatio;
    });
    svg.querySelectorAll('.highlight-net-overlay').forEach(el => {
      el.style.strokeWidth = getZoomStroke('highlightNetOverlay') * vbRatio;
    });
  }


  function applyZoomVisibility(){
    const svg = svgContainer.querySelector('svg');
    if(!svg) return;
    const titleGroup = svg.querySelector('.title-group');
    const rlGroup    = svg.querySelector('.rl-group');
    const hide = scale < ZOOM_THRESHOLD;
    if(titleGroup) titleGroup.classList.toggle('zoom-hidden', hide);
    if(rlGroup)    rlGroup.classList.toggle('zoom-hidden', hide);
  }


  let transformPending = false;
  function scheduleTransform(){
    if(transformPending) return;
    transformPending = true;
    requestAnimationFrame(()=>{
      transformPending = false;
      // start pan smoothness 28/05/2026 v2
      svgContainer.style.transform =
        `translate(${translate.x}px, ${translate.y}px) scale(${scale})`;
      // end pan smoothness 28/05/2026 v2
      svgContainer.style.transformOrigin = '0 0';
      applyZoomVisibility();
      // start bitmap code - fenil
      // Refresh stroke widths every time the scale changes so the
      // line thickness tracks the current zoom level.
      applyZoomLineThickness();
      // end bitmap code - fenil
    });
  }
  function updateTransform(){ scheduleTransform(); }

  function centerContent(){
    const svg = svgContainer.querySelector('svg');
    if(svg && window.__sbpm_svg_origViewBox){
      const orig = window.__sbpm_svg_origViewBox;
      svg.setAttribute('viewBox', `${orig.x} ${orig.y} ${orig.w} ${orig.h}`);
    }
    scale = 1;
    translate.x = 0;
    translate.y = 0;
    updateTransform();
    try { applyZoomLineThickness(); } catch(_){}
  }

  function zoomFromCenter(direction){
    const rect = svgContainer.getBoundingClientRect();
    const offsetX = rect.width / 2;
    const offsetY = rect.height / 2;
    const factor = direction > 0 ? 1.5 : 1 / 1.5;
    const minScale = 1;
    const maxScale = 160;
    const newScale = Math.min(Math.max(scale * factor, minScale), maxScale);
    if(newScale === scale) return;

    translate.x -= offsetX * (newScale - scale) / scale;
    translate.y -= offsetY * (newScale - scale) / scale;
    scale = newScale;
    updateTransform();
  }

  let wheelPending = false;
  let wheelDeltaY = 0;
  let wheelCX = 0, wheelCY = 0;
  function handleWheel(e){
    e.preventDefault();
    wheelDeltaY += e.deltaY;
    wheelCX = e.clientX;
    wheelCY = e.clientY;
    if(!wheelPending){
      wheelPending = true;
      requestAnimationFrame(()=>{
        wheelPending = false;
        const zoomFactor = 0.50;
        const delta = wheelDeltaY > 0 ? 1 - zoomFactor : 1 + zoomFactor;
        const wheelingOut = wheelDeltaY > 0;
        wheelDeltaY = 0;

      
        if (wheelingOut && scale <= 1.001 && window.__sbpm_svg_origViewBox){
          const svgEl0 = svgContainer.querySelector('svg');
          if (svgEl0 && svgEl0.viewBox && svgEl0.viewBox.baseVal){
            const cur  = svgEl0.viewBox.baseVal;
            const orig = window.__sbpm_svg_origViewBox;
            const atOrig =
              Math.abs(cur.width  - orig.w) < 0.5 &&
              Math.abs(cur.height - orig.h) < 0.5 &&
              Math.abs(cur.x      - orig.x) < 0.5 &&
              Math.abs(cur.y      - orig.y) < 0.5;
            if (!atOrig){
              const expand = 1 + zoomFactor; // 1.5 ×
              let newW = cur.width  * expand;
              let newH = cur.height * expand;
              if (newW > orig.w){ newW = orig.w; }
              if (newH > orig.h){ newH = orig.h; }
              // expand around current centre
              const cx = cur.x + cur.width  / 2;
              const cy = cur.y + cur.height / 2;
              let newX = cx - newW / 2;
              let newY = cy - newH / 2;
              if (newX < orig.x) newX = orig.x;
              if (newY < orig.y) newY = orig.y;
              if (newX + newW > orig.x + orig.w) newX = orig.x + orig.w - newW;
              if (newY + newH > orig.y + orig.h) newY = orig.y + orig.h - newH;
              svgEl0.setAttribute('viewBox', `${newX} ${newY} ${newW} ${newH}`);
           
              try { applyZoomLineThickness(); } catch(_){}
              return;
            }
          }
        }
        // end zoom-out-restore 22-06-2026 v14

        const proposedScale = scale * delta;
        const minScale = 1;
        const maxScale = 160;
        const newScale = Math.min(Math.max(proposedScale, minScale), maxScale);
        if(newScale === scale) return;

        const rect = svgContainer.getBoundingClientRect();
        const offsetX = wheelCX - rect.left;
        const offsetY = wheelCY - rect.top;

        translate.x -= offsetX * (newScale - scale) / scale;
        translate.y -= offsetY * (newScale - scale) / scale;

        scale = newScale;
        updateTransform();
      });
    }
  }

  function handleMouseDown(e){
    if(e.button !== 0) return;          // only left button pans
    isPanning = true;
    panStart = {x:e.clientX, y:e.clientY};
    mouseMoved = false;
  }
  function handleMouseUp(){
    isPanning = false;
  }
  function handleMouseMove(e){
    if(!isPanning) return;
   
    if((e.buttons & 1) === 0){ isPanning = false; return; }
    const dx = e.clientX - panStart.x;
    const dy = e.clientY - panStart.y;
    if(Math.abs(dx) > 5 || Math.abs(dy) > 5) mouseMoved = true;
   
    let panViaViewBox = false;
    try {
      const orig = window.__sbpm_svg_origViewBox;
      if (orig){
        const svg = svgContainer.querySelector('svg');
        if (svg && svg.viewBox && svg.viewBox.baseVal){
          const cur = svg.viewBox.baseVal;
          const zoomedIn =
            cur.width  < orig.w * 0.95 ||
            cur.height < orig.h * 0.95;
          if (zoomedIn){
            const svgRect = svg.getBoundingClientRect();
            if (svgRect.width > 0 && svgRect.height > 0){
              // Convert screen-px delta to userspace delta via the
              // current viewBox-to-screen ratio.
              const dxUser = dx * (cur.width  / svgRect.width );
              const dyUser = dy * (cur.height / svgRect.height);
              // Dragging RIGHT (positive dx) should reveal content on
              // the LEFT, i.e. shift the viewBox LEFT.
              let newX = cur.x - dxUser;
              let newY = cur.y - dyUser;
              // Clamp so we never pan past the original viewBox.
              if (newX < orig.x) newX = orig.x;
              if (newY < orig.y) newY = orig.y;
              if (newX + cur.width  > orig.x + orig.w) newX = orig.x + orig.w - cur.width;
              if (newY + cur.height > orig.y + orig.h) newY = orig.y + orig.h - cur.height;
              svg.setAttribute('viewBox',
                `${newX} ${newY} ${cur.width} ${cur.height}`);
              // Re-apply stroke widths in case viewBox-zoom ratio
              // changed materially (it shouldn't here since only x/y
              // changed, but cheap insurance).
              try { applyZoomLineThickness(); } catch(_){}
              panViaViewBox = true;
            }
          }
        }
      }
    } catch(_){}
    if (!panViaViewBox){
      translate.x += dx;
      translate.y += dy;
      updateTransform();
    }
    // end drag-viewbox-pan 22-06-2026 v18
    panStart = {x:e.clientX, y:e.clientY};
  }

  window.addEventListener('mouseleave', handleMouseUp);

  function parseComponentCoordinates(componentStr){
    if(!componentStr) return null;
    const m = componentStr.match(/x(\d+)_y(\d+)_w(\d+)_h(\d+)/);
    if(!m) return null;
    return {
      x:parseInt(m[1],10),
      y:parseInt(m[2],10),
      width:parseInt(m[3],10),
      height:parseInt(m[4],10)
    };
  }
  function parseTargetCoordinates(targetStr){
    if(!targetStr) return null;
    const tmp = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    try{
      tmp.innerHTML = String(targetStr).trim();
      const el = tmp.firstElementChild;
      if(!el) return null;
      const tag = el.tagName.toLowerCase();
      if(tag === 'rect'){
        return {
          x:parseFloat(el.getAttribute('x')) || 0,
          y:parseFloat(el.getAttribute('y')) || 0,
          width:parseFloat(el.getAttribute('width')) || 0,
          height:parseFloat(el.getAttribute('height')) || 0
        };
      }
      if(tag === 'circle'){
        const cx = parseFloat(el.getAttribute('cx')) || 0;
        const cy = parseFloat(el.getAttribute('cy')) || 0;
        const r = parseFloat(el.getAttribute('r')) || 0;
        return {x:cx-r,y:cy-r,width:r*2,height:r*2};
      }
      if(tag === 'ellipse'){
        const cx = parseFloat(el.getAttribute('cx')) || 0;
        const cy = parseFloat(el.getAttribute('cy')) || 0;
        const rx = parseFloat(el.getAttribute('rx')) || 0;
        const ry = parseFloat(el.getAttribute('ry')) || 0;
        return {x:cx-rx,y:cy-ry,width:rx*2,height:ry*2};
      }
    }catch(_){}
    return null;
  }
  function getPinCoordinates(pin){
    return parseComponentCoordinates(pin && (pin.component || pin.component_location))
        || parseTargetCoordinates(pin && (pin.target || pin.target_field));
  }
  function generateComponentIdFromCoords(target){
    const b = target.getBBox();
    return `x${Math.round(b.x)}_y${Math.round(b.y)}_w${Math.round(b.width)}_h${Math.round(b.height)}`;
  }
  function parseComponent(str){
    const [x,y,w,h] = str.replace("x","").replace("y","").replace("w","").replace("h","")
                         .split("_").map(n=>parseFloat(n));
    return {x,y,w,h};
  }

        componentByNet.get(c.netName).push(c);
      }
    });
  }

      lineHeight:'1.5',zIndex:1000,display:'none',

      top:'0',left:'0',

    const tooltipCache = new Map();

    if(oldGroup) oldGroup.remove();

    const titleGroup = document.createElementNS(ns, "g");
    titleGroup.classList.add('title-group');
    svg.appendChild(titleGroup);

    // Batched render — same idea as old viewer
    const BATCH = 300;
    let idx = 0;

    function renderBatch(){
      const frag = document.createDocumentFragment();
      const limit = Math.min(idx + BATCH, components.length);

      for(; idx < limit; idx++){
        const comp = components[idx];
        const coords = parseComponentCoordinates(comp.component);
        if(!coords) continue;

        const {x,y,width,height} = coords;
        const cx = x+width/2, cy = y+height/2;

        const rect = document.createElementNS(ns,"rect");
        rect.setAttribute("x",x);
        rect.setAttribute("y",y);
        rect.setAttribute("width",width);
        rect.setAttribute("height",height);
        rect.setAttribute("fill","transparent");
        rect.setAttribute("rx",10);
        rect.style.cursor="pointer";
        rect.dataset.componentId = comp.component;
        frag.appendChild(rect);

        const tick = document.createElementNS(ns,"text");
        tick.classList.add('title-element');
        tick.setAttribute("x",cx);
        tick.setAttribute("y",cy);
        tick.setAttribute("fill","black");
        tick.setAttribute("text-anchor","middle");
        tick.setAttribute("dominant-baseline","middle");
        tick.setAttribute("xml:space","preserve");
        tick.style.pointerEvents="none";
        tick.style.userSelect="none";

        const lines = [comp.netName].filter(Boolean);
        const textLength = Math.max(...lines.map(l=>l.length), 1);

        let fontSize = Math.min(width,height) * 0.1;
        const estCharW = fontSize * 0.6;
        const estTextW = textLength * estCharW;
        const maxW = width * 0.9;
        if(estTextW > maxW){
          fontSize = maxW / (textLength * 0.4);
        }
        tick.setAttribute("font-size", fontSize);

        const lineHeight = fontSize * 1.2;
        const startOff = -((lines.length - 1)/2) * lineHeight;
        lines.forEach((ln,i)=>{
          const t = document.createElementNS(ns,"tspan");
          t.setAttribute("x",cx);
          t.setAttribute("dy", i===0 ? startOff : lineHeight);
          t.textContent = ln;
          tick.appendChild(t);
        });
        frag.appendChild(tick);

        if(!tooltipCache.has(comp.component)){
          // start tooltip reorder 28/05/2026
          // Build only the rows whose values are present and not the
          // sentinel "NIL". User-requested order: Diode Value first
          // (most clinically useful), then Footprint, then Net Name,
          // then everything else with data.
          const hasVal = (v) => {
            if(v === null || v === undefined) return false;
            const s = String(v).trim();
            return s.length > 0 && s.toUpperCase() !== 'NIL';
          };
          const rows = [];
          if(hasVal(comp.diodeValue))     rows.push(`<div><strong>Diode Value:</strong> ${comp.diodeValue}</div>`);
          if(hasVal(comp.footprint))      rows.push(`<div><strong>Footprint:</strong> ${comp.footprint}</div>`);
          if(hasVal(comp.netName))        rows.push(`<div><strong>Net Name:</strong> ${comp.netName}</div>`);
          if(hasVal(comp.pinNumber))      rows.push(`<div><strong>Pin Number:</strong> ${comp.pinNumber}</div>`);
          if(hasVal(comp.comment))        rows.push(`<div><strong>Comment:</strong> ${comp.comment}</div>`);
          if(hasVal(comp.capacitorValue)) rows.push(`<div><strong>Capacitor Value:</strong> ${comp.capacitorValue}</div>`);
          if(hasVal(comp.voltageValue))   rows.push(`<div><strong>Voltage Value:</strong> ${comp.voltageValue}</div>`);
          if(hasVal(comp.ohmValue))       rows.push(`<div><strong>Ohm Value:</strong> ${comp.ohmValue}</div>`);
          const header = `<div style="font-weight:600;margin-bottom:6px;">Component: ${comp.name||''}</div>`;
          tooltipCache.set(comp.component, header + rows.join(''));
          // end tooltip reorder 28/05/2026
        }
      }

      titleGroup.appendChild(frag);

      if(idx < components.length){
        if(typeof requestIdleCallback === 'function'){
          requestIdleCallback(renderBatch);
        } else {
          setTimeout(renderBatch, 0);
        }
      }
    }
    renderBatch();

    // Tooltip hover
    titleGroup.addEventListener('mousemove', e=>{
      tooltip.style.left = (e.pageX + 10) + 'px';
      tooltip.style.top  = (e.pageY + 10) + 'px';
    });
    titleGroup.addEventListener('mouseover', e=>{
      const r = e.target.closest('rect[data-component-id]');
      if(!r) return;
      const html = tooltipCache.get(r.dataset.componentId);
      if(!html) return;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      r.addEventListener('mouseout', ()=> tooltip.style.display='none', {once:true});
    });

    // Apply zoom gate immediately
    applyZoomVisibility();
  }

  let localSvgFile = null;
  let localJsonFile = null;
  let currentSvgContent = '';
  let currentJsonData = null;

  function normalizeSvgJsonData(jsonData){
    let componentData = [];
    let components = [];
    let problems = [];

    if(Array.isArray(jsonData)){
      componentData = jsonData;
      components = jsonData;
    } else if(jsonData && typeof jsonData === 'object') {
      componentData = jsonData.component_data
                   || jsonData.componentData
                   || (jsonData.data && (jsonData.data.component_data || jsonData.data.componentData))
                   || [];

      components = jsonData.main_components
                || jsonData.components
                || (jsonData.data && (jsonData.data.main_components || jsonData.data.components))
                || [];

      problems = jsonData.problems
              || (jsonData.data && jsonData.data.problems)
              || [];
    }

    components = components.map(c => ({
      ...c,
      target: c.target || c.target_field || ''
    }));
    componentData = componentData.map(c => ({
      ...c,
      target: c.target || c.target_field || ''
    }));

    if(!componentData.length && components.length) componentData = components;
    if(!components.length && componentData.length) components = componentData;

    return { componentData, components, problems };
  }

  function setExportAvailability(){
    const btn = document.getElementById('export-bundle-btn');
    if(btn) btn.disabled = !(currentSvgContent && currentJsonData);
  }

  async function loadSVGWithJSONData(svgTxt, jsonData){
    const normalized = normalizeSvgJsonData(jsonData);
    currentSvgContent = svgTxt;
    currentJsonData = jsonData;
    window.currentComponentData = normalized.componentData;
    buildIndexes(normalized.componentData);
    window.loadedProblems = normalized.problems;
    showComponentInfoBar(normalized.componentData[0] || normalized.components[0] || {});
    loadSVG(svgTxt, 'svg-container', normalized.componentData, normalized.components);
    loadProblemsFromJson(normalized.problems);
    setExportAvailability();
  }

  async function fetchAndLoadSVGWithJSON(svgUrl, jsonUrl){
    try{
      console.log('🔵 Fetching SVG from:', svgUrl);
      console.log('🔵 Fetching JSON from:', jsonUrl);

      const [svgRes, jsonRes] = await Promise.all([
        fetch(svgUrl),
        fetch(jsonUrl)
      ]);
      const svgTxt = await svgRes.text();
      const jsonData = await jsonRes.json();

      await loadSVGWithJSONData(svgTxt, jsonData);
    }catch(err){
      console.error("❌ Error loading SVG/JSON:", err);
      svgContainer.innerHTML = `<p style="color:red;padding:20px;">Error loading SVG/JSON: ${err.message}</p>`;
    }
  }

  async function loadSVG(svgContent, containerId, componentData, allComponents){
    try{
      const container = document.getElementById(containerId);
      container.innerHTML = svgContent;
      const svg = container.querySelector('svg');
      if(!svg){ alert('SVG element not found.'); return; }

   
      computeStrokeBases(svg);
    
      const linesBox = document.getElementById('enable-line-checkbox');
      if(linesBox && !linesBox.checked){
        linesBox.checked = true;
      }
     

      setupComponentsText(allComponents);

      try { window.allComponentsList = allComponents || []; } catch(_){}
    
      try {
        requestAnimationFrame(() => {

            if(og) og.remove();

  function findComponentForElement(el){
    if(!el || !el.tagName) return null;
    const tag = el.tagName.toLowerCase();

    // Helper: try a component key against the pin index.
    function lookupExact(key){
      const c = componentByKey.get(key);
      return c || null;
    }

    // 1) Build key(s) from the element's own SVG attributes.
    const keys = [];
    if(tag === 'circle'){
      const cx = parseFloat(el.getAttribute('cx'));
      const cy = parseFloat(el.getAttribute('cy'));
      const r  = parseFloat(el.getAttribute('r'));
      if(isFinite(cx) && isFinite(cy) && isFinite(r)){
        const x = cx - r, y = cy - r, w = 2*r, h = 2*r;
        keys.push(`x${x}_y${y}_w${w}_h${h}`);
        keys.push(`x${Math.round(x)}_y${Math.round(y)}_w${Math.round(w)}_h${Math.round(h)}`);
      }
    } else if(tag === 'rect'){
      const x = parseFloat(el.getAttribute('x'));
      const y = parseFloat(el.getAttribute('y'));
      const w = parseFloat(el.getAttribute('width'));
      const h = parseFloat(el.getAttribute('height'));
      if(isFinite(x) && isFinite(y) && isFinite(w) && isFinite(h)){
        keys.push(`x${x}_y${y}_w${w}_h${h}`);
        keys.push(`x${Math.round(x)}_y${Math.round(y)}_w${Math.round(w)}_h${Math.round(h)}`);
      }
    }
    for(const k of keys){
      const hit = lookupExact(k);
      if(hit) return hit;
    }

    return null;
  }
 
  function findComponentForPoint(hx, hy){
    if(!isFinite(hx) || !isFinite(hy)) return null;
    let best = null, bestArea = Infinity;
    for(const arr of componentByNet.values()){
      for(const cand of arr){
        const cc = parseComponent(cand.component);
        if(!cc || !isFinite(cc.x) || !isFinite(cc.y) || !isFinite(cc.w) || !isFinite(cc.h)) continue;
        if(cc.w <= 0 || cc.h <= 0) continue;
        if(hx < cc.x || hx > cc.x + cc.w) continue;
        if(hy < cc.y || hy > cc.y + cc.h) continue;
        const area = cc.w * cc.h;
        if(area < bestArea){ bestArea = area; best = cand; }
      }
    }
    return best;
  }
 
  function showChipPinNames(cx, cy, cw, ch){

    const frag = document.createDocumentFragment();

        if(!pc || !isFinite(pc.x) || !isFinite(pc.y) || !isFinite(pc.w) || !isFinite(pc.h)) continue;
        const px = pc.x + pc.w / 2;

        // Only pins whose centre falls inside this chip's bbox.
        if(px < cx || px > x2) continue;

        const estCharW = fontSize * 0.6;
        const estTextW = text.length * estCharW;
        const maxW = pc.w * 0.9;
        if(estTextW > maxW){
          fontSize = maxW / (text.length * 0.4);
        }
        if(!isFinite(fontSize) || fontSize <= 0){
          fontSize = Math.max(1, Math.min(pc.w, pc.h) * 0.08);
        }
        label.setAttribute("font-size", fontSize);
        label.textContent = text;

       
        label.classList.add("highlighted-overlay");
        label.classList.add("chip-pin-label");

        frag.appendChild(label);
        count++;
      }

  function _findParentChipBboxForPin(pin){
    const pc = parseComponent(pin && pin.component);
    if(!pc) return null;
    const hx = pc.x + pc.w / 2;
    const hy = pc.y + pc.h / 2;
    let best = null, bestArea = Infinity;
    if(typeof chipBboxIndex !== 'undefined' && chipBboxIndex && chipBboxIndex.size){
      for(const ch of chipBboxIndex.values()){
        if(hx < ch.x || hx > ch.x + ch.w) continue;
        if(hy < ch.y || hy > ch.y + ch.h) continue;
        const a = ch.w * ch.h;
        if(a < bestArea){ bestArea = a; best = ch; }
      }
    }
    if(!best && Array.isArray(window.allComponentsList)){
      for(const c of window.allComponentsList){
        const loc = parseComponentCoordinates(c && c.component_location);
        if(!loc) continue;
        if(hx < loc.x || hx > loc.x + loc.width) continue;
        if(hy < loc.y || hy > loc.y + loc.height) continue;
        const a = loc.width * loc.height;
        if(a < bestArea){
          bestArea = a;
          best = { x: loc.x, y: loc.y, w: loc.width, h: loc.height, name: c.component_name || '' };
        }
      }
    }
    return best;
  }

  function showAllChipPinDataForPin(clickedPin){
    const chip = _findParentChipBboxForPin(clickedPin);
    if(!chip) return;
    const svg = svgContainer.querySelector('svg');
    if(!svg) return;
    const cx = chip.x, cy = chip.y, x2 = chip.x + chip.w, y2 = chip.y + chip.h;
    const ns = "http://www.w3.org/2000/svg";
    const frag = document.createDocumentFragment();
    // Build a set of components already labelled by the same-net
    // drawConnectionLine pass so we don't double-paint on top of
    // them (those pads already have the red overlay + label).
    const sameNetSet = new Set();
    if(clickedPin && clickedPin.netName){
      const arr = (componentByNet.get(clickedPin.netName) || []);
      for(const p of arr) sameNetSet.add(p.component);
    }
    let count = 0;
    for(const pin of componentByKey.values()){
      if(!pin || !pin.component) continue;
      if(sameNetSet.has(pin.component)) continue;     // skip same-net (already labelled)
      const pc = parseComponent(pin.component);
      if(!pc) continue;
      const px = pc.x + pc.w / 2;
      const py = pc.y + pc.h / 2;
      if(px < cx || px > x2) continue;
      if(py < cy || py > y2) continue;
      // start net-label-on-pad 28/05/2026 v5
      // Match the styled rendering used by drawConnectionLine —
      // small white badge with red diode value at the top, bold
      // footprint in the centre, net name underneath.
      const footprt = _hasMeaning2(pin.footprint)  ? String(pin.footprint).trim()  : '';
      const netRaw  = _hasMeaning2(pin.netName)    ? String(pin.netName).trim()    : '';
      if(!footprt && !netRaw) continue;

      let base = Math.min(pc.w, pc.h) * 0.18;
      const longest = Math.max(
        footprt.length, netRaw.length, 1
      );
      const maxW = pc.w * 0.88;
      const estW = longest * base * 0.55;
      if(estW > maxW) base = maxW / (longest * 0.5);
      if(!isFinite(base) || base <= 0) base = Math.max(1, Math.min(pc.w, pc.h) * 0.1);
      const fpF = base * 1.0, netF = base * 1.0, gap = base * 0.08;
      const rows = [];
      if(footprt) rows.push({ kind:'fp',    fs: fpF,  text: footprt });
      if(netRaw)  rows.push({ kind:'net',   fs: netF, text: netRaw });
      let totalH = rows.reduce((a, r) => a + r.fs, 0) + gap * (rows.length - 1);
      let yCur   = py - totalH / 2;
      rows.forEach((r) => {
        const rowCy = yCur + r.fs / 2;
        const txt = document.createElementNS(ns, "text");
        txt.setAttribute("x", px); txt.setAttribute("y", rowCy);
        txt.setAttribute("fill", "#0a0a0a");
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("dominant-baseline", "middle");

        txt.setAttribute("font-weight", r.kind === 'fp' ? "700" : "600");
        txt.style.pointerEvents = "none";
        txt.style.userSelect    = "none";
        txt.textContent = r.text;
        txt.classList.add("highlighted-overlay");
        txt.classList.add("chip-data-label");
        frag.appendChild(txt);
        yCur += r.fs + gap;
      });
      count++;
      // end net-label-on-pad 28/05/2026 v5
    }
    svg.appendChild(frag);
    try { console.log('[BRAZILIAN] pin click → rendered', count, 'chip-wide pin data labels'); } catch(_){}
  }

  function showComponentInfoBar(component){
    const bar = document.getElementById('component-info-bar');

      voltage_value:'Voltage', voltage:'Voltage', diodeValue:'Diode',

    };

      'ohms','ohm','capacitorValue','capacitor_value',
      'footprint','target'
    ];
    const normalizeInfoKey = key => String(key)

      'component', 'componentlocation', 'location', 'position',
      'pin', 'pinnumber', 'target', 'targetfield',
      'filename', 'svgfilename', 'svgfile', 'svgname', 'jsonfilename',
      'fileid', 'fileidentifier', 'idfile', 'filenameid',
      'createdat', 'creationdate', 'creationtime', 'datecreated',
      'updatedat', 'updateddate', 'updatetime', 'dateupdated',
      'created', 'updated', 'id', 'comment'
    ]);
    const keys = [...preferred, ...Object.keys(component).filter(k => !preferred.includes(k))]
      .filter(key => !hiddenInfoKeys.has(normalizeInfoKey(key)));
    const escapeHtml = value => String(value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const formatValue = value => {
      if(Array.isArray(value) || (value && typeof value === 'object')) return JSON.stringify(value);
      return String(value);
    };
    const formatLabel = key => labelNames[key] || key
      .replace(/([a-z])([A-Z])/g,'$1 $2')
      .replace(/[_-]+/g,' ')
      .replace(/^./, char => char.toUpperCase());
    const icons = {
      voltagevalue:'<svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7z"></path></svg>',

      diode:'<svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6"></path><path d="M14 12h6"></path><path d="m10 7 5 5-5 5z"></path><path d="M15 7v10"></path></svg>',
      ohmvalue:'<svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3"></path><path d="M18 12h3"></path><path d="M6 12l2-4 3 8 3-8 3 8 1-4"></path></svg>',
      ohms:'<svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3"></path><path d="M18 12h3"></path><path d="M6 12l2-4 3 8 3-8 3 8 1-4"></path></svg>',
      ohm:'<svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3"></path><path d="M18 12h3"></path><path d="M6 12l2-4 3 8 3-8 3 8 1-4"></path></svg>',
      capacitorvalue:'<svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6"></path><path d="M14 12h6"></path><path d="M10 5v14"></path><path d="M14 5v14"></path></svg>',
      capacitance:'<svg class="component-info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6"></path><path d="M14 12h6"></path><path d="M10 5v14"></path><path d="M14 5v14"></path></svg>'
    };
    const renderLabel = key => {

      return icon ? `<span class="component-info-label" title="${escapeHtml(formatLabel(key))}" aria-label="${escapeHtml(formatLabel(key))}">${icon}</span>` : `<span class="component-info-label">${escapeHtml(formatLabel(key))}</span>`;

    fields.innerHTML = keys.filter(key => hasInfoValue(component[key]))

      .join('');
    bar.hidden = false;

  function _findParentChipNameForPin(pin){
    const pc = parseComponent(pin && pin.component);
    if(!pc) return '';
    const hx = pc.x + pc.w / 2;
    const hy = pc.y + pc.h / 2;
    // Iterate chipBboxIndex (populated by setupComponentsText).
    let best = null, bestArea = Infinity;
    if(typeof chipBboxIndex !== 'undefined' && chipBboxIndex && chipBboxIndex.size){
      for(const ch of chipBboxIndex.values()){
        if(hx < ch.x || hx > ch.x + ch.w) continue;
        if(hy < ch.y || hy > ch.y + ch.h) continue;
        const a = ch.w * ch.h;
        if(a < bestArea){ bestArea = a; best = ch; }
      }
    }
    // Fallback — scan window.allComponentsList directly.
    if(!best && Array.isArray(window.allComponentsList)){
      for(const c of window.allComponentsList){
        const loc = parseComponentCoordinates(c && c.component_location);
        if(!loc) continue;
        if(hx < loc.x || hx > loc.x + loc.width) continue;
        if(hy < loc.y || hy > loc.y + loc.height) continue;
        const a = loc.width * loc.height;
        if(a < bestArea){ bestArea = a; best = { name: c.component_name || '' }; }
      }
    }
    return best ? (best.name || '') : '';
  }
  function copySubcompDataToClipboard(pin){

    // start subcomp-click popup 28/05/2026 v3

    // returning on missing chip name was the cause of the "click in

    else if(_hasMeaningfulValue(pin.component))  text = String(pin.component).trim();

      try { console.warn('[BRAZILIAN-svg] no text to copy/broadcast for pin:', pin); } catch(_){}
      return;
    }
    try { console.log('[BRAZILIAN-svg] resolved click text:', text, '(chipName:', chipName, ')'); } catch(_){}
   
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).catch(() => {});
      }
    } catch(_){}
    try {

      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';

      ta.remove();

    try {
      if(window.parent && window.parent !== window){
        window.parent.postMessage({ type:'sbpm:copy-text', text: text }, '*');
       
        window.parent.postMessage({ type:'sbpm:compare-search', text: text }, '*');
        try {
          console.log('[BRAZILIAN-svg] pin click → posted copy+compare-search "%s" to parent', text);
        } catch(_){}
        // end compare-click-search 28/05/2026 v2
      }
    } catch(e){
      try { console.warn('[BRAZILIAN-svg] postMessage to parent failed:', e); } catch(_){}
    }
    
  }
