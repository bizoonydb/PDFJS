
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGITAL BOARD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080a0e;
    font-family: Arial, sans-serif;
    color: white;
}

body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: #ffd900;
    filter: blur(180px);
    opacity: 0.07;
    border-radius: 50%;
}

.container {
    position: relative;
    text-align: center;
    padding: 30px;
    width: 100%;
}

.logo {
    font-size: clamp(35px, 7vw, 75px);
    font-weight: 900;
    letter-spacing: 5px;
    color: #ffffff;
    text-shadow: 0 0 25px rgba(255,217,0,0.25);
}

.logo span {
    color: #ffd900;
}

.line {
    width: 100px;
    height: 3px;
    background: #ffd900;
    margin: 25px auto;
    box-shadow: 0 0 15px #ffd900;
}

.status {
    font-size: clamp(16px, 3vw, 25px);
    font-weight: bold;
    letter-spacing: 5px;
    color: #ffd900;
    text-transform: uppercase;
}

.message {
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 4px;
    color: #858585;
}

.loading {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 35px;
}

.loading div {
    width: 7px;
    height: 7px;
    background: #ffd900;
    border-radius: 50%;
    animation: pulse 1.2s infinite;
}

.loading div:nth-child(2) {
    animation-delay: .2s;
}

.loading div:nth-child(3) {
    animation-delay: .4s;
}

@keyframes pulse {
    0%, 100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }
}

.footer {
    position: absolute;
    bottom: 25px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #555;
    font-size: 10px;
    letter-spacing: 4px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        DIGITAL <span>BOARD</span>
    </div>

    <div class="line"></div>

    <div class="status">
        EM MANUTENÇÃO
    </div>

    <div class="message">
        TENTE MAIS TARDE
    </div>

    <div class="loading">
        <div></div>
        <div></div>
        <div></div>
    </div>

</div>

<div class="footer">
    DIGITAL BOARD © 2026
</div>

</body>
</html>
